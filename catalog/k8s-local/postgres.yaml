# ponytail: emptyDir, not a PVC — data is lost on pod restart. Fine for a
# throwaway kind-local learning cluster; add a PVC if that ever matters here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-db
  namespace: stampede
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-db
  template:
    metadata:
      labels:
        app: catalog-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: catalog-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: stampede
spec:
  selector:
    app: catalog-db
  ports:
    - port: 5432
      targetPort: 5432
