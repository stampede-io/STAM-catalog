apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: stampede
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: catalog:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: catalog-secret
          env:
            # Image default -XX:MaxMetaspaceSize=128m OOMs under real request
            # traffic in this cluster (observed loading Kafka/actuator proxy
            # classes). Metaspace bumped the same way booking's was; heap
            # trimmed from the image default 256m to leave more headroom
            # above heap+metaspace within the fixed 640Mi container limit
            # (thread stacks, JIT code cache, Kafka/Netty direct buffers).
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -XX:MaxMetaspaceSize=224m"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
